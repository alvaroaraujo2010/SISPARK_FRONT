<header class="navbar-shell">
  <div class="container-shell navbar-shell__inner">
    <a class="brand" [routerLink]="homeLink()">
      <span class="logo-tile logo-tile--nav" aria-hidden="true">
        <img src="images/logo_moderno_de_sispark.png" alt="SisPark" decoding="async" />
      </span>
      <div>
        <span>SISPARK</span>
        <small>Modulo administrativo</small>
      </div>
    </a>

    <div class="navbar-shell__cluster">
      <nav class="nav-links">
        @if (showOperations()) {
          <a routerLink="/admin/inicio" routerLinkActive="active">Inicio</a>
        }
        @if (showAdminMenu()) {
          <a routerLink="/admin/vehiculos" routerLinkActive="active">Vehiculos</a>
          <a routerLink="/admin/parqueadero" routerLinkActive="active">Parqueadero</a>
          <a routerLink="/admin/usuarios" routerLinkActive="active">Usuarios</a>
        }
        @if (showReports()) {
          <a routerLink="/admin/reportes" routerLinkActive="active">Reportes</a>
        }
      </nav>

      @if (isAuthenticated()) {
        <div class="nav-session">
          <span class="nav-user">
            <small>Sesion activa</small>
            <strong>{{ session()?.fullName }}</strong>
          </span>
          <span class="nav-role">{{ roleLabel(session()?.role) }}</span>
          <button class="nav-logout" type="button" (click)="logout()">Salir</button>
        </div>
      }
    </div>
  </div>
</header>
