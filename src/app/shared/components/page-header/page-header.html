<header class="page-header">
  <div class="page-header__intro">
    @if (kicker()) {
      <span class="page-header__kicker">{{ kicker() }}</span>
    }
    <h1 class="page-header__title">{{ title() }}</h1>
    @if (description()) {
      <p class="page-header__description">{{ description() }}</p>
    }
  </div>
  @if (sessionName()) {
    <div class="page-header__session">
      <span class="page-header__session-label">Sesion</span>
      <strong>{{ sessionName() }}</strong>
      @if (sessionRole()) {
        <span class="page-header__session-role">{{ roleLabel(sessionRole()) }}</span>
      }
    </div>
  }
</header>
